name: BeachTennisCounter
options:
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  bundleIdPrefix: com.renan.beachtennis
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
  # Pinned rather than left to XcodeGen's "first configuration alphabetically",
  # which `Dev` does not change today but any future config starting A–C would.
  defaultConfig: Debug
  knownRegions:
    - Base
    - en
    - pt-BR

# `Dev` is the dev flavor: a debug build that installs alongside the App Store
# app under its own bundle id. `Debug` deliberately stays unflavored so the
# production bundle id remains debuggable.
#
# XcodeGen matches `settings.configs` keys by case-insensitive *substring*
# unless the key names a config exactly. `Dev` is exact and therefore safe —
# but adding a config like `Development` would silently inherit everything
# below.
configs:
  Debug: debug
  Dev: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.3.1"
    CURRENT_PROJECT_VERSION: "7"
    # The three axes the flavor varies. Everything else is derived from them,
    # so a new flavor is a new `configs` entry and nothing more.
    BASE_BUNDLE_ID: com.renan.beachtennis
    BUNDLE_ID_SUFFIX: ""
    APP_DISPLAY_NAME: Beach Tennis Score
    APPICON_SUFFIX: ""
  configs:
    Dev:
      BUNDLE_ID_SUFFIX: .dev
      APP_DISPLAY_NAME: Beach Dev
      APPICON_SUFFIX: "-Dev"

targets:
  BeachTennisCounterTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.renan.beachtennis.tests
    dependencies:
      - target: BeachTennisCounter

  BeachTennisCounter:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: iOS
      - path: Shared
    info:
      path: iOS/Info.plist
      properties:
        CFBundleName: BeachTennisCounter
        CFBundleDisplayName: "$(APP_DISPLAY_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        # The App Group holding the live Match History store, read at runtime by
        # `LiveStore.appGroupIdentifier`. Derived from the bundle id so a
        # flavored build carries its own group without touching Swift. The
        # entitlement below is the same group spelled literally — flavor the two
        # together or the app resolves a container it is not entitled to.
        AppGroupIdentifier: "group.$(PRODUCT_BUNDLE_IDENTIFIER)"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: iOS/BeachTennisCounter.entitlements
      properties:
        # Expanded, not literal, so it tracks the flavored bundle id in lockstep
        # with the `AppGroupIdentifier` plist key above. Entitlements files do
        # expand build settings — verified in the built `.xcent` per
        # configuration, and on device by the installation ticket.
        com.apple.security.application-groups:
          - group.$(BASE_BUNDLE_ID)$(BUNDLE_ID_SUFFIX)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID)$(BUNDLE_ID_SUFFIX)
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: iOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon$(APPICON_SUFFIX)
    dependencies:
      - target: BeachTennisCounterWatch

  BeachTennisCounterWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: watchOS
      - path: Shared
    info:
      path: watchOS/Info.plist
      properties:
        CFBundleName: BeachTennisWatch
        CFBundleDisplayName: "$(APP_DISPLAY_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        # Derived, so the watch app always points at the phone app of its own
        # flavor. `:base` strips the last dot-component — `.watchkitapp` — off
        # this target's own bundle id.
        WKCompanionAppBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER:base)"
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: "Beach Tennis Score reads your heart rate and calories during a match to show your heart rate live and record your workout stats."
        NSHealthUpdateUsageDescription: "Beach Tennis Score saves each match as a workout in the Health app so you get activity credit."
    entitlements:
      path: watchOS/BeachTennisCounterWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID)$(BUNDLE_ID_SUFFIX).watchkitapp
        INFOPLIST_FILE: watchOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon$(APPICON_SUFFIX)

schemes:
  BeachTennisCounter:
    build:
      targets:
        BeachTennisCounter: all
        BeachTennisCounterWatch: all
        BeachTennisCounterTests: [testing]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BeachTennisCounterTests
    archive:
      config: Release

  BeachTennisCounterWatch:
    build:
      targets:
        BeachTennisCounterWatch: all
    run:
      config: Debug

  # The dev flavor gets its own schemes rather than flipping the ones above:
  # picking "Beach Dev" in Xcode's scheme menu is the whole gesture, and the
  # production bundle id stays one pick away.
  Beach Dev:
    build:
      targets:
        BeachTennisCounter: all
        BeachTennisCounterWatch: all
        BeachTennisCounterTests: [testing]
    run:
      config: Dev
    test:
      config: Dev
      targets:
        - BeachTennisCounterTests

  Beach Dev Watch:
    build:
      targets:
        BeachTennisCounterWatch: all
    run:
      config: Dev
